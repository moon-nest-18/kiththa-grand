<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kiththa Grand</title>
  <script>
    /*
      GitHub Pages SPA redirect trick.
      When GitHub Pages returns a 404 for a clean URL like /products,
      this page captures the full URL, stores it in sessionStorage,
      then redirects to the root. The router in index.html reads it
      and navigates to the correct page.
    */
    var path = window.location.pathname + window.location.search;
    sessionStorage.setItem('kg_redirect', path);
    window.location.replace('/');
  </script>
</head>
<body></body>
</html>
